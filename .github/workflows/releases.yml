name: Build and Upload MCPvP Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing GitHub release tag (for example v7.0.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build plugin and attach JAR
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.2"

      - name: Build release JAR
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          gradle -PreleaseVersion="$VERSION" clean build --no-daemon

      - name: Upload JAR to the existing GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: build/libs/*.jar
          fail_on_unmatched_files: true
