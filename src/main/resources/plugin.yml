name: SoulPvP
version: '${version}'
main: com.ogbonex.mcpvp.McpvpPlugin
api-version: '1.21.11'
authors: [OGBONEX]
description: "SoulPvP competitive Minecraft PvP: kits, ranked matchmaking, duels, FFA and custom arenas."
commands:
  mcpvp:
    description: Main command
    usage: /mcpvp
  kit:
    description: Manage and view kits
    usage: /kit
  arena:
    description: Manage arenas and themes
    usage: /arena
  queue:
    description: Join, leave or inspect kit matchmaking
    usage: /queue [ranked|unranked] <kit>
  leave:
    description: Leave your current matchmaking queue
    usage: /leave
    aliases: [qleave]
  settings:
    description: Open your player settings
    usage: /settings
  ffa:
    description: Join or leave free-for-all arenas
    usage: /ffa <join|leave>
  party:
    description: Create and manage player parties
    usage: /party <create|invite|accept|leave|kick|disband|split|ffa|info|chat>
  achievements:
    description: View unlocked PvP achievements and points
    usage: /achievements
  stats:
    description: View player match statistics and leaderboard
    usage: /stats [player|top [wins|kills]]
  duel:
    description: Challenge another player to a duel
    usage: /duel <player|accept|deny>
  spec:
    description: Spectate an active match
    usage: /spec <player|leave>
  menu:
    description: Open the navigation menu
    usage: /menu
  match:
    description: View or forfeit your current match
    usage: /match <info|forfeit>
  rank:
    description: View or manage player ranks
    usage: /rank <player|set|add|remove>
    aliases: [ranks]
  elo:
    description: View your competitive ELO rating and tier
    usage: /elo
  streak:
    description: View your current and best killstreak
    usage: /streak
  history:
    description: View your recent match history
    usage: /history
  rematch:
    description: Request or accept a rematch
    usage: /rematch [accept]
permissions:
  mcpvp.admin:
    description: Allows administration
    default: op
  mcpvp.rank.manage:
    description: Allows assigning and removing player ranks
    default: op
