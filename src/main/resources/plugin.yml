name: MCPvP
version: '${version}'
main: com.ogbonex.mcpvp.McpvpPlugin
api-version: '1.21.11'
authors: [OGBONEX]
description: A classic-inspired MCPvP minigame plugin.
commands:
  mcpvp:
    description: Main MCPvP command
    usage: /mcpvp
  kit:
    description: Manage and view kits
    usage: /kit
  arena:
    description: Manage MCPvP arenas
    usage: /arena
  queue:
    description: Join or leave kit matchmaking
    usage: /queue
  stats:
    description: View player match statistics
    usage: /stats [player]
permissions:
  mcpvp.admin:
    description: Allows administration of MCPvP
    default: op
