name: MCPvP
version: '${version}'
main: com.ogbonex.mcpvp.McpvpPlugin
api-version: '1.21.11'
authors: [OGBONEX]
description: "MCPvP: The Arena — a competitive PvP network toolkit with kit matchmaking, duels, ranked-ready stats and custom arenas."
commands:
  mcpvp:
    description: Main MCPvP command
    usage: /mcpvp
  kit:
    description: Manage and view kits
    usage: /kit
  arena:
    description: Manage MCPvP arenas and themes
    usage: /arena
  queue:
    description: Join, leave or inspect kit matchmaking
    usage: /queue <join|leave|status>
  stats:
    description: View player match statistics and leaderboard
    usage: /stats [player|top [wins|kills]]
  duel:
    description: Challenge another player to a duel
    usage: /duel <player|accept|deny>
  spec:
    description: Spectate an active match
    usage: /spec <player|leave>
  kits:
    description: Open the kit queue selector
    usage: /kits
  menu:
    description: Open the MCPvP navigation menu
    usage: /menu
  match:
    description: View or forfeit your current match
    usage: /match <info|forfeit>
  rank:
    description: View or manage player ranks
    usage: /rank <player|set|add|remove>
    aliases: [ranks]
permissions:
  mcpvp.admin:
    description: Allows administration of MCPvP
    default: op
  mcpvp.rank.manage:
    description: Allows assigning and removing player ranks
    default: op
